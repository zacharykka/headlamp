services:
  postgres:
    image: postgres:17-alpine
    container_name: headlamp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: headlamp
      POSTGRES_USER: headlamp
      POSTGRES_PASSWORD: ${HEADLAMP_PG_PASSWORD:?Set HEADLAMP_PG_PASSWORD in deploy/headlamp.env or .env}
    volumes:
      - headlamp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U headlamp -d headlamp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  headlamp:
    image: ghcr.io/zacharykka/headlamp:latest
    # To build from local source instead of pulling GHCR:
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile
    container_name: headlamp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./headlamp.env
    environment:
      HEADLAMP_CONFIG: /etc/headlamp/headlamp.yaml
      HEADLAMP_STATE_DIR: /data
      HEADLAMP_STORAGE_DRIVER: postgres
      HEADLAMP_STORAGE_DSN: postgres://headlamp:${HEADLAMP_PG_PASSWORD}@postgres:5432/headlamp?sslmode=disable
      # Optional local HTTP listener (bind only to 127.0.0.1 below; NEVER set HEADLAMP_DEV_MODE=true in Docker):
      # HEADLAMP_LOCAL_LISTEN: 0.0.0.0:8080
    # ports:
    #   - "127.0.0.1:8080:8080"
    volumes:
      - ./headlamp.yaml:/etc/headlamp/headlamp.yaml:ro
      # Named volume is initialized with UID/GID 65532:65532 from the distroless image.
      # If you switch to a host bind mount (e.g. ./data:/data), run: chown -R 65532:65532 ./data
      - headlamp_data:/data
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  headlamp_data:
  headlamp_pgdata:
