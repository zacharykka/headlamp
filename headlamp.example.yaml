# Headlamp configuration example.
# Copy to headlamp.yaml and override secrets via environment variables.
# Supported secret placeholders use ${ENV_VAR} syntax.
#
# Authorization in Headlamp is purely grants-driven:
# - Tailnet callers are authorized via Headscale v0.29+ / Tailscale `grants`
#   (`headlamp.dev/cap/gateway`, plus `tailscale.com/cap/aperture` on Tailscale SaaS).
# - Non-Tailnet callers using `server.api_tokens` carry inline allow/deny scopes.
# - Local development callers (`dev_mode: true`) require a loopback `local_listen`.

server:
  tsnet:
    enabled: true
    hostname: headlamp
    # Headscale control plane URL. Leave empty to connect to official Tailscale SaaS.
    control_url: "https://headscale.example.com"
    # Pre-auth key used for first-time node registration (or set HEADLAMP_AUTH_KEY).
    auth_key: "${HEADLAMP_AUTH_KEY}"
    # Persistent directory for tsnet state and auto-generated master.key.
    state_dir: "./data"
    ephemeral: false
    # Default 80 when tls.mode is "none", or 443 when TLS is enabled.
    listen_port: 80

  tls:
    # Supported modes: none | static | acme_dns01
    mode: none
    # Required when mode is "static":
    cert_file: ""
    key_file: ""
    # Required when mode is "acme_dns01":
    domain: ""
    acme_email: ""
    dns_provider: ""

  # Optional local HTTP listener for development, /healthz, or non-tailnet callers.
  # Must bind a loopback host (127.0.0.1, ::1, or localhost) whenever dev_mode is true.
  local_listen: "127.0.0.1:8080"

  # Local development mock identity (only allowed with loopback local_listen).
  dev_mode: false
  dev_user: "dev@local"
  dev_roles:
    - admin
    - user
  # Keep false unless you explicitly want loopback clients to override identity via X-Headlamp-Dev-* headers.
  dev_allow_header_override: false

  # Optional static fallback API tokens for non-tailnet callers (e.g. CI runners).
  # allow_models defaults to ["*"] if omitted.
  api_tokens:
    # - name: ci-runner
    #   token: "${HEADLAMP_CI_TOKEN}"
    #   subject: "tag:ci-runner"
    #   display_name: "CI Runner"
    #   roles: ["user"]
    #   tags: ["tag:ci-runner"]
    #   allow_models: ["openai/gpt-4.1*", "ollama/*"]
    #   deny_models: ["openai/o3*"]
    #   allow_mcp_tools: ["docs/*"]
    #   deny_mcp_tools: []

storage:
  # Supported drivers: sqlite | postgres
  driver: sqlite
  dsn: "./data/headlamp.db"

providers:
  - name: anthropic
    type: anthropic
    base_url: "https://api.anthropic.com"
    api_key: "${ANTHROPIC_API_KEY}"
    passthrough: false
    models:
      - "claude-sonnet-4-6"
      - "claude-opus-4-6"
      - "claude-haiku-4-5"

  - name: openai
    type: openai
    base_url: "https://api.openai.com"
    api_key: "${OPENAI_API_KEY}"
    passthrough: false
    models:
      - "gpt-5"
      - "gpt-4.1"
      - "gpt-4.1-mini"
      - "o4-mini"

  - name: gemini
    type: gemini
    base_url: "https://generativelanguage.googleapis.com"
    api_key: "${GEMINI_API_KEY}"
    passthrough: false
    models:
      - "gemini-2.5-pro"
      - "gemini-2.5-flash"

  - name: ollama
    type: ollama
    base_url: "http://127.0.0.1:11434"
    api_key: ""
    passthrough: false
    models:
      - "qwen2.5-coder:32b"

routes:
  - alias: "team/coding"
    provider: anthropic
    model: "claude-sonnet-4-6"
    fallbacks:
      - provider: openai
        model: "gpt-4.1"

  - alias: "team/fast"
    provider: gemini
    model: "gemini-2.5-flash"
    fallbacks:
      - provider: openai
        model: "gpt-4.1-mini"

audit:
  # Privacy-minimal default: metadata in usage_logs only, full payloads disabled.
  store_payloads: false
  # Days to retain audit_payloads when enabled (0 disables automatic purge).
  retention_days: 7

# ---------------------------------------------------------------------------
# Headscale v0.29.7 Policy & Grants Reference Snippet (HuJSON)
# ---------------------------------------------------------------------------
# Save as your Headscale policy file (policy.path in headscale config.yaml).
# Notes for Headscale v0.29.7:
#   - Always use "headlamp.dev/cap/gateway" on Headscale (Headscale v0.29.7
#     rejects "tailscale.com/cap/*" capability names; "tailscale.com/cap/aperture"
#     compatibility applies to official Tailscale SaaS only).
#   - For non-OIDC Headscale users, policy src/groups use a trailing "@"
#     (e.g. "alice@"), while WhoIs / GET /whoami reports "alice" without "@".
#
# {
#   "groups": {
#     "group:admins": ["alice@"],
#     "group:engineering": ["alice@", "bob@"]
#   },
#   "tagOwners": {
#     "tag:headlamp": ["group:admins"],
#     "tag:ci-runner": ["group:admins"]
#   },
#   "grants": [
#     {
#       "src": ["group:admins"],
#       "dst": ["tag:headlamp"],
#       "ip": ["tcp:80", "tcp:443"],
#       "app": {
#         "headlamp.dev/cap/gateway": [
#           {
#             "role": "admin",
#             "models": ["**"],
#             "mcp_tools": ["**"]
#           }
#         ]
#       }
#     },
#     {
#       "src": ["group:engineering"],
#       "dst": ["tag:headlamp"],
#       "ip": ["tcp:80", "tcp:443"],
#       "app": {
#         "headlamp.dev/cap/gateway": [
#           {
#             "role": "user",
#             "models": ["anthropic/*", "openai/gpt-4.1*", "team/*"],
#             "deny_models": ["openai/o3*"],
#             "mcp_tools": ["docs/*", "github/read_*"]
#           }
#         ]
#       }
#     }
#   ]
# }
#
# In Headscale v0.29.7 config.yaml:
#   policy:
#     mode: file
#     path: /etc/headscale/policy.hujson
#   dns:
#     magic_dns: true
#     base_domain: tailnet.internal
#
# Register Headlamp with a reusable tagged pre-auth key (Headscale v0.29+ tagged keys are user-less):
#   headscale preauthkeys create --reusable --tags tag:headlamp --expiration 24h
